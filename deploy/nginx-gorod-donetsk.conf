# https://город-донецк.рф (punycode xn----etbdbf4ateadr3f.xn--p1ai) на VPS метрики-ребёнка.
# Файл на сервере: /etc/nginx/sites-available/site-gorod-donetsk, симлинк в sites-enabled с тем же именем.
# Публичный 443 держит Xray: h2 падает на 127.0.0.1:8081, остальное на :8082, оба с PROXY v2.
# listen обязан совпадать с остальными vhost сервера, иначе nginx не поднимется.
# Корень: статика портала /var/www/gorod-donetsk. Раздел /svet/: сервис карты света на 127.0.0.1:8765
# (KARTA_ORIGIN=https://xn----etbdbf4ateadr3f.xn--p1ai, KARTA_BASE=/svet), префикс не срезается.
# Сертификат: certbot webroot /var/www/acme, копия для Xray делает /etc/letsencrypt/renewal-hooks/deploy/xray-certs.sh.

server {
    listen 80;
    listen [::]:80;
    server_name xn----etbdbf4ateadr3f.xn--p1ai www.xn----etbdbf4ateadr3f.xn--p1ai;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://xn----etbdbf4ateadr3f.xn--p1ai$request_uri;
    }
}

server {
    listen 127.0.0.1:8081 proxy_protocol http2;
    listen 127.0.0.1:8082 proxy_protocol;
    server_name xn----etbdbf4ateadr3f.xn--p1ai;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    root /var/www/gorod-donetsk;
    index index.html;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/javascript text/css application/xml image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    location = /svet { return 301 /svet/; }

    location ^~ /svet/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 32k;
    }

    location = /index.html { return 301 /; }

    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }
}

server {
    listen 127.0.0.1:8081 proxy_protocol http2;
    listen 127.0.0.1:8082 proxy_protocol;
    server_name www.xn----etbdbf4ateadr3f.xn--p1ai;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;

    location / {
        return 301 https://xn----etbdbf4ateadr3f.xn--p1ai$request_uri;
    }
}

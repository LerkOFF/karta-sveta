# Старый адрес https://lerk.tech/svet/ (VPS метрики-ребёнка): теперь только переход на https://свет-донецк.рф.
# Подключается строкой `include /var/www/karta-sveta/deploy/nginx-karta-sveta.conf;`
# внутри server lerk.tech (порты 8081/8082), рядом с include для /pokupki/.
# API оставлен проксированием: старые читалки и закладки продолжают работать.
# Основной vhost свет-донецк.рф: deploy/nginx-svet-donetsk.conf.

location = /svet { return 301 https://xn----ctbhcc4athwm3c.xn--p1ai/; }

location ^~ /svet/api/ {
    proxy_pass http://127.0.0.1:8765/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
}

location ^~ /svet/ { return 301 https://xn----ctbhcc4athwm3c.xn--p1ai/; }

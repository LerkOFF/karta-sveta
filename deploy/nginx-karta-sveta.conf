# Карта света на https://lerk.tech/svet/ (VPS метрики-ребёнка).
# Подключается строкой `include /var/www/karta-sveta/deploy/nginx-karta-sveta.conf;`
# внутри server lerk.tech (порты 8081/8082), рядом с include для /pokupki/.
# Процесс слушает только 127.0.0.1:8765. Настоящий адрес человека приходит в X-Real-IP,
# сервер хранит из него только короткий хеш.

location = /svet { return 301 /svet/; }

location ^~ /svet/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
    client_max_body_size 32k;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/javascript text/css;
}

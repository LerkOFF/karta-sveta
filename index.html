<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта света — Донецк</title>
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <main id="map">
    <section class="card">
      <div class="search">
        <input id="query" type="search" placeholder="Найти улицу" autocomplete="off" aria-label="Улица">
        <button id="here" type="button" class="btn ghost">Моё место</button>
        <ul id="results" class="results" hidden></ul>
      </div>
      <p id="picked" class="picked">Нажмите на карте на улицу, где хотите отметить свет.</p>
      <div id="scopes" class="chips" role="group" aria-label="Длина участка">
        <button type="button" data-r="100" class="on">200 м</button>
        <button type="button" data-r="200">400 м</button>
        <button type="button" data-r="500">1 км</button>
        <button type="button" data-r="0">вся улица</button>
      </div>
      <div class="houses">
        <span>Дома</span>
        <input id="h-from" type="text" inputmode="numeric" placeholder="с" autocomplete="off" aria-label="Дома с номера">
        <span>–</span>
        <input id="h-to" type="text" inputmode="numeric" placeholder="по" autocomplete="off" aria-label="Дома по номер">
        <button id="h-go" type="button" class="btn ghost">Показать</button>
      </div>
      <div class="actions">
        <button id="on" type="button" class="btn on" disabled>Свет есть</button>
        <button id="off" type="button" class="btn off" disabled>Света нет</button>
      </div>
      <p id="mark-note" class="note"></p>
    </section>
    <p id="bulletin" class="bulletin" hidden></p>
    <div class="legend legend-overlay">
      <span><i class="swatch on"></i>есть</span>
      <span><i class="swatch off"></i>нет</span>
      <span><i class="swatch fade"></i>блёклый: давно не подтверждали</span>
      <span><i class="swatch nbr"></i>штрихи: по соседям</span>
      <span><i class="swatch base"></i>точки: по сводке или по умолчанию</span>
    </div>
  </main>
  <aside>
    <header class="mast">
      <p class="eyebrow">Донецк</p>
      <h1>Карта света</h1>
    </header>

    <section class="block">
      <h2>Группы</h2>
      <div id="groups" class="pills"></div>
    </section>

    <section class="block">
      <h2>Куда звонить</h2>
      <div id="phones"></div>
    </section>

    <p class="foot"><a href="about.html">О карте и источниках</a>. Линии улиц © участники OpenStreetMap.</p>
  </aside>
  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script src="app.js?v=21"></script>
</body>
</html>
